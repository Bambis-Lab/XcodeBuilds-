name: Foundation Checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'foundation/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate registry and profiles
        run: python3 scripts/preflight/validate_repo.py
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Screenshot fixture positive acceptance
        run: |
          python3 scripts/screenshots/generate_fixture.py "$RUNNER_TEMP/xbscreens"
          python3 scripts/screenshots/validate.py --root "$RUNNER_TEMP/xbscreens" --manifest fixtures/screenshots/manifest.json --report "$RUNNER_TEMP/screenshot-report.json"
      - name: Attach sample acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-acceptance-report
          path: ${{ runner.temp }}/screenshot-report.json
          if-no-files-found: ignore
          retention-days: 7
