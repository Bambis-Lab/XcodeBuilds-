name: Reusable Integration Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'foundation/**']
    paths:
      - '.github/workflows/reusable-*.yml'
      - 'scripts/build/**'
      - 'fixtures/swift-smoke/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reusable-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    uses: ./.github/workflows/reusable-apple-build.yml
    with:
      tooling_ref: ${{ github.sha }}
      project_kind: swift-package
      source_path: fixtures/swift-smoke
  swift-tests:
    uses: ./.github/workflows/reusable-apple-tests.yml
    with:
      tooling_ref: ${{ github.sha }}
      project_kind: swift-package
      source_path: fixtures/swift-smoke
