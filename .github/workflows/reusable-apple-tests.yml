name: Reusable Apple Tests (unsigned)

on:
  workflow_call:
    inputs:
      tooling_ref:
        description: "Reviewed full tooling SHA; match workflow ref"
        type: string
        required: true
      project_kind:
        type: string
        required: true
      source_path:
        type: string
        required: true
      scheme:
        type: string
        default: ''
      destination:
        type: string
        default: 'platform=iOS Simulator,name=iPhone 18 Pro Max'
      configuration:
        type: string
        default: Debug

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Bambis-Lab/XcodeBuilds-
          ref: ${{ inputs.tooling_ref }}
          path: .xcodebuilds-tools
          persist-credentials: false
      - name: Execute test suite without signing
        env:
          XB_PROJECT_KIND: ${{ inputs.project_kind }}
          XB_SOURCE_PATH: ${{ inputs.source_path }}
          XB_SCHEME: ${{ inputs.scheme }}
          XB_DESTINATION: ${{ inputs.destination }}
          XB_CONFIGURATION: ${{ inputs.configuration }}
        run: python3 .xcodebuilds-tools/scripts/build/run.py test
      - name: Export test logs and xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xb-tests-report
          path: |
            .xb-output/metadata.json
            .xb-output/logs/
            .xb-output/Results/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
